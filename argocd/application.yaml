apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab5-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JSW10888/sample-ci-cd-app.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: lab5
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
