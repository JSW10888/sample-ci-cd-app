apiVersion: apps/v1
kind: Deployment
metadata:
  name: secured-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secured-app
  template:
    metadata:
      labels:
        app: secured-app
    spec:
      containers:
        - name: secured-app
          image: docker.io/jsw10888/todo-app:hardened
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: LAB_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: secured-app-config
                  key: LAB_ENVIRONMENT
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"